name: Client CI

on:
  pull_request:
  push:
    branches:
      - main
  # Nightly, so a change in the next Lighthouse image (dev-latest) shows up before anyone cuts a release.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The release packs the same way, so a skill that would not pack fails here, before anything is published.
      - name: Pack skills (dry run)
        run: |
          out="$(mktemp -d)"
          bash scripts/pack-skills.sh "$out"
          expected=(lighthouse lighthouse-refinement lighthouse-daily-flow-review)
          for name in "${expected[@]}"; do
            [[ -f "$out/$name-skill.zip" ]] || { echo "missing $name-skill.zip"; exit 1; }
          done

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Build
        run: pnpm build

      - name: Smoke test bin launch (npx regression guard)
        run: |
          # mcp-stdio: must exit 1 with "Failed to resolve Lighthouse URL" when no URL configured
          LIGHTHOUSE_STANDALONE_LOCKFILE_PATH=/tmp/smoke-missing.lock.json \
            node packages/mcp-stdio/dist/bin.js 2>&1 | grep -q "Failed to resolve Lighthouse URL" \
            && echo "mcp-stdio smoke: PASS" \
            || (echo "mcp-stdio smoke: FAIL - unexpected output"; exit 1)

          # mcp-http: must exit 1 with "Missing LIGHTHOUSE_URL" when env var absent
          node packages/mcp-http/dist/bin.js 2>&1 | grep -q "Missing LIGHTHOUSE_URL" \
            && echo "mcp-http smoke: PASS" \
            || (echo "mcp-http smoke: FAIL - unexpected output"; exit 1)

  # The integration smoke with the packages built from this commit, before anything is published.
  # The latest leg gates the release: it is the server users run today. The dev-latest leg carries server
  # changes not yet released, so it may fail for reasons this commit cannot fix. On a push to main it only
  # warns, so it never blocks a release; the nightly and manual runs go red, so the failure gets noticed.
  smoke-prerelease:
    name: Integration smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs:
      - verify
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    continue-on-error: ${{ !matrix.gates_release && github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/letpeoplework/lighthouse:latest
            gates_release: true
          - image: ghcr.io/letpeoplework/lighthouse:dev-latest
            gates_release: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # One install of both tarballs, so the CLI's client dependency (pinned to the same version by pack)
      # resolves to the client packed here rather than the one already on npm.
      - name: Install the CLI packed from this commit
        run: |
          packs="$RUNNER_TEMP/packs"
          prefix="$RUNNER_TEMP/lh"
          for pkg in client cli; do
            (cd "packages/$pkg" && pnpm pack --pack-destination "$packs")
          done
          npm install --prefix "$prefix" --no-fund --no-audit "$packs"/*.tgz
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "LH_PREFIX=$prefix" >> "$GITHUB_ENV"

      # A client copy nested under the CLI, or one resolved from the registry, means the smoke would test
      # the client already on npm instead of the one packed from this commit.
      - name: Check the CLI uses the client packed from this commit
        run: |
          nested="$LH_PREFIX/node_modules/@letpeoplework/lighthouse-cli/node_modules/@letpeoplework/lighthouse-client"
          test ! -d "$nested" || { echo "::error::the CLI carries its own client from npm: $nested"; exit 1; }
          resolved="$(jq -r '.packages["node_modules/@letpeoplework/lighthouse-client"].resolved // ""' "$LH_PREFIX/package-lock.json")"
          echo "client resolved from: $resolved"
          case "$resolved" in
            file:*) ;;
            *) echo "::error::the client did not come from the packed tarball: '$resolved'"; exit 1 ;;
          esac

      # Archiving a Delivery is a premium feature, so the archived check needs a licence. Without the secret
      # (a fork, or before it is configured) the smoke skips that one check and says so.
      - name: Run the integration smoke against ${{ matrix.image }}
        env:
          SMOKE_LICENSE: ${{ secrets.LIGHTHOUSE_SMOKE_LICENSE }}
        run: |
          if [ -n "$SMOKE_LICENSE" ]; then
            export LIGHTHOUSE_SMOKE_LICENSE_FILE="$RUNNER_TEMP/smoke-license.json"
            printf '%s' "$SMOKE_LICENSE" > "$LIGHTHOUSE_SMOKE_LICENSE_FILE"
          fi
          bash scripts/smoke-integration.sh "${{ matrix.image }}"

      - name: Report a failure against ${{ matrix.image }}
        if: failure()
        env:
          IMAGE: ${{ matrix.image }}
          GATES_RELEASE: ${{ matrix.gates_release }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$GATES_RELEASE" = "true" ]; then
            echo "::error title=Integration smoke failed::against $IMAGE; the Release gate stays closed."
            echo "### Integration smoke FAILED against \`$IMAGE\`; the Release gate stays closed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT" = "push" ]; then
            echo "::warning title=Integration smoke failed::against $IMAGE, the next Lighthouse release. Not blocking this release; check before that server ships."
            echo "### Integration smoke FAILED (warning only) against \`$IMAGE\` (next Lighthouse release). Not blocking this release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Integration smoke failed::against $IMAGE, the next Lighthouse release. Check before that server ships."
            echo "### Integration smoke FAILED against \`$IMAGE\` (next Lighthouse release). Check before that server ships." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Only a commit that bumps a package version has anything to publish. Every other push to main would
  # otherwise park at the Release gate forever, and the oldest parked run blocks every newer one.
  unpublished:
    runs-on: ubuntu-latest
    needs:
      - verify
      - smoke-prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      any: ${{ steps.check.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Look for package versions not yet on npm
        id: check
        run: |
          any=false
          for manifest in packages/*/package.json; do
            [ "$(jq -r '.private // false' "$manifest")" = "true" ] && continue
            spec="$(jq -r '"\(.name)@\(.version)"' "$manifest")"
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              echo "$spec is not on npm yet"
              any=true
            fi
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs:
      - verify
      - smoke-prerelease
      - unpublished
    # Only a push may ask for the Release environment; a nightly or manual run never parks at the gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.unpublished.outputs.any == 'true'
    environment: Release
    # A newer version bump supersedes a release still awaiting approval, so approving never ships a stale commit.
    concurrency:
      group: release
      cancel-in-progress: true

    outputs:
      cli_version: ${{ steps.get_versions.outputs.cli_version }}
      release_tag: ${{ steps.get_versions.outputs.release_tag }}

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to latest version for OIDC support
        run: npm install -g npm@latest

      - name: Extract Versions
        id: get_versions
        run: |
          CLI_VER=$(jq -r .version packages/cli/package.json)
          MCP_VER=$(jq -r .version packages/mcp-http/package.json)
          MCP_STDIO_VER=$(jq -r .version packages/mcp-stdio/package.json)
          RELEASE_DATE=$(date -u +'%Y.%m.%d')
          RELEASE_TAG="${RELEASE_DATE}.${{ github.run_number }}"
          echo "CLI_VERSION=$CLI_VER" >> $GITHUB_ENV
          echo "MCP_VERSION=$MCP_VER" >> $GITHUB_ENV
          echo "MCP_STDIO_VERSION=$MCP_STDIO_VER" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "cli_version=$CLI_VER" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Before npm publish, so a skill that will not pack stops the release while nothing is out yet.
      - name: Pack skills
        run: bash scripts/pack-skills.sh release-assets

      - name: Publish npm packages
        run: pnpm release:publish --tag latest
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build CLI release binaries
        run: |
          mkdir -p release-assets
          bun build ./packages/cli/src/bin.ts --compile --target bun-linux-x64-modern --outfile ./release-assets/lh
          tar -czf ./release-assets/lh-linux-x64.tar.gz -C ./release-assets lh
          bun build ./packages/cli/src/bin.ts --compile --target bun-darwin-x64-modern --outfile ./release-assets/lh
          tar -czf ./release-assets/lh-darwin-x64.tar.gz -C ./release-assets lh
          bun build ./packages/cli/src/bin.ts --compile --target bun-windows-x64-modern --outfile ./release-assets/lh.exe
          cd release-assets && zip -q lh-windows-x64.zip lh.exe

      - name: Build and pack mcp-stdio MCPB bundle
        run: |
          mkdir -p mcpb-staging/server
          jq --arg v "$MCP_STDIO_VERSION" '.version = $v' \
            packages/mcp-stdio/mcpb/manifest.json > mcpb-staging/manifest.json
          cp packages/mcp-stdio/mcpb/launcher.cjs mcpb-staging/server/launcher.cjs
          cp packages/mcp-stdio/dist/mcpb-runtime.cjs mcpb-staging/server/mcpb-runtime.cjs
          npx -y @anthropic-ai/mcpb validate mcpb-staging/manifest.json
          npx -y @anthropic-ai/mcpb pack mcpb-staging/ release-assets/lighthouse-mcp-stdio.mcpb

      - name: Copy install/uninstall scripts to release assets
        run: |
          cp scripts/install.sh release-assets/install.sh
          cp scripts/uninstall.sh release-assets/uninstall.sh
          cp scripts/install.ps1 release-assets/install.ps1
          cp scripts/uninstall.ps1 release-assets/uninstall.ps1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_TAG }}
          name: Lighthouse Clients ${{ env.RELEASE_TAG }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/lh-linux-x64.tar.gz
            release-assets/lh-darwin-x64.tar.gz
            release-assets/lh-windows-x64.zip
            release-assets/install.sh
            release-assets/uninstall.sh
            release-assets/install.ps1
            release-assets/uninstall.ps1
            release-assets/lighthouse-mcp-stdio.mcpb
            release-assets/*-skill.zip

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if mcp-http image version already exists
        id: check_docker
        run: |
          IMAGE=ghcr.io/letpeoplework/lighthouse-clients/mcp-http:${{ env.MCP_VERSION }}
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Image $IMAGE already exists — skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Image $IMAGE not found — will publish"
          fi

      - name: Build and push mcp-http container
        if: steps.check_docker.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/mcp-http/Dockerfile
          push: true
          tags: |
            ghcr.io/letpeoplework/lighthouse-clients/mcp-http:${{ env.MCP_VERSION }}
            ghcr.io/letpeoplework/lighthouse-clients/mcp-http:latest

  smoke-platform:
    runs-on: ${{ matrix.os }}
    needs: release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start smoke fixture
        id: start_fixture
        run: |
          node scripts/smoke-fixture.mjs &
          for i in $(seq 1 20); do
            [ -f .fixture-port ] && break
            sleep 0.5
          done
          if [ ! -f .fixture-port ]; then
            echo "ERROR: Fixture server did not start within 10 s"
            exit 1
          fi
          FIXTURE_PORT=$(cat .fixture-port)
          echo "fixture_port=$FIXTURE_PORT" >> "$GITHUB_OUTPUT"
          echo "Fixture ready on port $FIXTURE_PORT"

      - name: Install CLI via npm
        run: npm install -g @letpeoplework/lighthouse-cli@${{
          needs.release.outputs.cli_version }}

      - name: Verify CLI starts up
        run: |
          OUTPUT=$(lh 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "lh connection connect" \
            || (echo "FAIL: lh produced no help output"; exit 1)
          echo "CLI startup assertion: PASS"

      - name: Connect CLI to fixture
        run: |
          lh connection connect \
            --mode server \
            --url http://127.0.0.1:${{ steps.start_fixture.outputs.fixture_port }}

      - name: Verify team list
        run: |
          TEAMS=$(lh team list --json)
          echo "$TEAMS"
          echo "$TEAMS" | grep -q "FixtureTeam" \
            || (echo "FAIL: FixtureTeam not found in team list"; exit 1)
          echo "Team list assertion: PASS"

  # The same smoke as smoke-prerelease, but with the CLI as it actually landed on npm.
  smoke-integration:
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install CLI via npm
        run: npm install -g @letpeoplework/lighthouse-cli@${{
          needs.release.outputs.cli_version }}

      - name: Run the integration smoke against ghcr.io/letpeoplework/lighthouse:latest
        env:
          SMOKE_LICENSE: ${{ secrets.LIGHTHOUSE_SMOKE_LICENSE }}
        run: |
          if [ -n "$SMOKE_LICENSE" ]; then
            export LIGHTHOUSE_SMOKE_LICENSE_FILE="$RUNNER_TEMP/smoke-license.json"
            printf '%s' "$SMOKE_LICENSE" > "$LIGHTHOUSE_SMOKE_LICENSE_FILE"
          fi
          bash scripts/smoke-integration.sh ghcr.io/letpeoplework/lighthouse:latest
